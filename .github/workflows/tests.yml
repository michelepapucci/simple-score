name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            transformers: "transformers>=4.38,<5"
          - python: "3.12"
            transformers: "transformers>=5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "${{ matrix.transformers }}"
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts reproduce recipes
      - name: Test
        run: pytest -q
