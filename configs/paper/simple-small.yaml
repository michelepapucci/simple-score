# SIMPLE-small as trained for the paper (DeBERTa-v3-small, 1 GPU).
# Build the data first:  python recipes/paper/build_paper_data.py --newsela-dir <newsela>
model:
  backbone: microsoft/deberta-v3-small
  max_length: 512
training:
  epochs: 5
  batch_size: 32
  regression_batch_size: 32
  lr: 2.0e-5
  lambda_reg: 0.7
  # The released checkpoints were selected on SimpEval 2022 pairwise accuracy (the
  # Table 2 test set). To select on held-out data instead, use: select_on: val_inter
  select_on: monitor:simpeval2022
data: ../../data/paper/data.yaml
monitor:
  - {path: ../../data/paper/monitor/simpeval2022_pairs.tsv, kind: pairwise, name: simpeval2022}
  - {path: ../../data/paper/monitor/simpeval2022_ratings.tsv, kind: ratings, name: simpeval2022_ratings}
output_dir: runs/paper/simple-small
